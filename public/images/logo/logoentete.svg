<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="100%" height="100%" role="img" aria-label="Logo MTC">
  <defs>
    <!-- Dégradé argent métallique pour le contour -->
    <linearGradient id="silver-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Lueur cyan au cœur du T et du C -->
    <radialGradient id="cyan-core" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </radialGradient>

    <!-- Dégradé Cyan/Argent pour les zones lumineuses internes -->
    <linearGradient id="cyan-stroke" x1="20%" y1="20%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#67E8F9" />
      <stop offset="75%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Masque pour creuser l'intérieur des lettres (effet double trait) -->
    <mask id="hollow-logo-mask">
      <rect width="320" height="300" fill="white" />
      <!-- Évidement intérieur du M -->
      <path d="M 65 210 C 73 200 73 190 73 175 L 73 68 C 102 72 132 95 160 130 C 188 95 218 72 247 68 L 247 132" fill="none" stroke="black" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />
      <!-- Évidement intérieur du T -->
      <path d="M 105 128 L 215 128 M 160 128 L 160 205 C 160 225 148 238 128 242" fill="none" stroke="black" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />
      <!-- Évidement intérieur du C -->
      <path d="M 248 152 C 234 134 205 130 186 144 C 166 158 164 195 182 216 C 200 237 232 234 248 216" fill="none" stroke="black" stroke-width="11" stroke-linecap="square" stroke-linejoin="miter" />
    </mask>
  </defs>

  <!-- Fond simple plat (Supprime cette ligne <rect> si tu veux un fond transparent) -->
  <rect width="320" height="300" fill="#0B0F17" />

  <!-- Halo lumineux subtil derrière l'intersection T/C -->
  <circle cx="165" cy="175" r="75" fill="url(#cyan-core)" />

  <!-- Structure principale avec effet double trait creux -->
  <g mask="url(#hollow-logo-mask)">
    <!-- 1. Lettre M avec courbes supérieures et empattement gauche évasé -->
    <path d="M 65 210 C 73 200 73 190 73 175 L 73 68 C 102 72 132 95 160 130 C 188 95 218 72 247 68 L 247 132" fill="none" stroke="url(#silver-edge)" stroke-width="21" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- 2. Lettre T centrale avec barre horizontale et jambe courbée vers la gauche -->
    <path d="M 105 128 L 215 128 M 160 128 L 160 205 C 160 225 148 238 128 242" fill="none" stroke="url(#cyan-stroke)" stroke-width="21" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- 3. Lettre C imbriquée à droite -->
    <path d="M 248 152 C 234 134 205 130 186 144 C 166 158 164 195 182 216 C 200 237 232 234 248 216" fill="none" stroke="url(#cyan-stroke)" stroke-width="21" stroke-linecap="square" stroke-linejoin="miter" />
  </g>
</svg>
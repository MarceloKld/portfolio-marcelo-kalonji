<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" role="img" aria-label="Logo Marcelo Tech">
  <defs>
    <!-- Dégradé argenté métallique pour les contours -->
    <linearGradient id="silver-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D1D5DB" />
      <stop offset="75%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#E5E7EB" />
    </linearGradient>

    <!-- Dégradé argent-cyan pour le cœur du T et la courbe du C -->
    <linearGradient id="cyan-silver-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#67E8F9" />
      <stop offset="75%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Dégradé texte principal -->
    <linearGradient id="text-metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#E5E7EB" />
      <stop offset="100%" stop-color="#9CA3AF" />
    </linearGradient>

    <!-- Lueur cyan centrale fidèle à l'image -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrière simple plat (supprime cette ligne <rect> si tu veux un fond 100% transparent) -->
  <rect width="800" height="450" fill="#070B0E" />

  <!-- Groupe Monogramme MTC (Structure double-ligne / ruban creux) -->
  <g transform="translate(275, 45)" stroke-linejoin="miter" stroke-miterlimit="10">
    
    <!-- Lueur cyan diffuse derrière la jonction T / C -->
    <circle cx="122" cy="145" r="42" fill="#22D3EE" opacity="0.18" filter="url(#cyan-glow)" />

    <!-- 1. LETTRE M (Ruban creux avec courbes internes) -->
    <!-- Contour extérieur du M -->
    <path d="M 18 195 
             C 30 195, 34 185, 34 165 
             L 34 35 
             C 72 35, 102 65, 125 98 
             C 148 65, 178 35, 216 35 
             L 216 115 
             L 200 115 
             L 200 54 
             C 174 58, 152 80, 134 108 
             L 172 108 
             L 172 122 
             L 78 122 
             L 78 108 
             L 116 108 
             C 98 80, 76 58, 50 54 
             L 50 165 
             C 50 192, 40 206, 18 206 Z" fill="#070B0E" stroke="url(#silver-stroke)" stroke-width="4.2" />

    <!-- 2. LETTRE T (Barre intégrée au M et tige centrale courbée vers la gauche) -->
    <path d="M 78 108 
             L 172 108 
             L 172 122 
             L 132 122 
             L 132 178 
             C 132 206, 114 224, 84 226 
             L 84 212 
             C 104 209, 116 196, 116 176 
             L 116 122 
             L 78 122 Z" fill="#070B0E" stroke="url(#cyan-silver-stroke)" stroke-width="4.2" filter="url(#cyan-glow)" />

    <!-- 3. LETTRE C (Ruban creux entrelacé sur la droite) -->
    <path d="M 216 115 
             L 216 135 
             L 232 148 
             L 220 160 
             C 208 147, 194 142, 178 142 
             C 155 142, 141 158, 141 180 
             C 141 202, 155 218, 178 218 
             C 194 218, 208 212, 220 199 
             L 232 211 
             C 217 227, 199 234, 178 234 
             C 145 234, 124 211, 124 180 
             C 124 149, 145 126, 178 126 
             C 186 126, 194 127, 200 130 
             L 200 115 Z" fill="#070B0E" stroke="url(#cyan-silver-stroke)" stroke-width="4.2" />
  </g>

  <!-- Texte Principal : MARCELO TECH -->
  <text x="400" y="348" text-anchor="middle" fill="url(#text-metal)" font-family="&#39;Montserrat&#39;, &#39;Space Grotesk&#39;, &#39;Segoe UI&#39;, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="7">
    MARCELO TECH
  </text>

  <!-- Signature : CONCEPTION · CODE · INNOVATION -->
  <text x="400" y="385" text-anchor="middle" fill="#D1D5DB" font-family="&#39;Inter&#39;, &#39;Segoe UI&#39;, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="4.5">
    CONCEPTION · CODE · INNOVATION
  </text>
</svg>